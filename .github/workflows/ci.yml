name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same PR or branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    # Linux only on purpose: some tests read iMessage chat.db fixtures and spawn
    # subprocesses, so macOS and Windows behaviour is unverified. Do not add an
    # OS matrix until those paths are checked on the other platforms.
    runs-on: ubuntu-latest
    # This suite spawns subprocesses and exercises long-poll timeouts, so cap the
    # job rather than let a hung test burn Actions minutes indefinitely.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version used locally so a Bun release cannot change CI
          # results underneath us. Bump deliberately, together with the toolchain.
          bun-version: 1.3.14

      - name: Install dependencies
        # The lockfile is committed, so fail loudly instead of silently resolving
        # different versions than the ones that were reviewed.
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        # The suite is hermetic: Telegram is mocked through
        # BRIDGE_TELEGRAM_API_BASE and Bun.serve, and state is written to temp
        # dirs. It needs no secrets, tokens, or network access.
        run: bun test
